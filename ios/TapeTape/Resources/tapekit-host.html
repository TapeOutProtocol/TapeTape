<h1>屏蔽规则与举报</h1>
<p>这个网关只做一件事：把存在链上（BNB Chain、X Layer、Base）的网站读出来交给你的浏览器。内容不在这台服务器上，我们删不掉链上的任何东西；但网关是展示方，可以拒绝显示。</p>
<h2>会被屏蔽的内容</h2>
<ul>
<li>儿童性剥削材料；</li>
<li>恶意软件、钓鱼、伪装成他人（含伪装成钱包或交易所）的页面；</li>

<h2>怎么举报</h2>

<li>被屏蔽的网站打开时显示「此客户端已屏蔽这个网站」，不显示任何内容；</li>

<hr>
<h1>Blocking policy &amp; reporting</h1>
<p>This gateway does one thing: it reads websites stored on chain (BNB Chain, X Layer, Base) and hands them to your browser. The content is not on this server and we cannot delete anything on chain; but the gateway is the party doing the displaying, and it can refuse to display.</p>
<h2>What gets blocked</h2>
<ul>
<li>Child sexual abuse material;</li>
<li>Malware, phishing, and pages impersonating others (including wallets and exchanges);</li>
<li>Infringing content after a valid notice;</li>
<li>Other content clearly prohibited by the law of the jurisdiction the gateway operates in.</li>
</ul>
<h2>How to report</h2>
<p>Email <span class="mono">codongorg@gmail.com</span> with the subject <span class="mono">[tapekit abuse]</span>. Include the site's on-chain name (for example <span class="mono">4246.0.tape</span>) or subdomain, what the problem is, and who you are (copyright complaints need proof of rights).</p>
<h2>Timeline and method</h2>
<ol>
<li>Acknowledgement within 24 hours;</li>
<li>Confirmed reports are added to the blocklist within 48 hours. The list is a public static file, <a href="/.tape/blocklist.txt">/.tape/blocklist.txt</a>, keyed by on-chain name or container address, effective everywhere within 10 minutes;</li>
<li>A blocked site shows "this client has blocked this site" and no content;</li>
