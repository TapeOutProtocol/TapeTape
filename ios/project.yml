name: TapeTape
options:
  bundleIdPrefix: org.tapetape
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.22"
    CURRENT_PROJECT_VERSION: "23"
    CODE_SIGN_STYLE: Automatic
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  TapeTapeCore:
    type: framework
    platform: iOS
    sources:
      - path: ../core/out/ios/bindings/tapetape_core.swift
    dependencies:
      - framework: ../core/out/ios/TapeTapeCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tapetape.v2.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  TapeTape:
    type: application
    platform: iOS
    sources:
      - path: TapeTape
    dependencies:
      - target: TapeTapeCore
      - target: TapeTapeShare
    entitlements:
      path: TapeTape/TapeTape.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.tapetape.v2
        com.apple.developer.associated-domains:
          - applinks:i.tapetape.org
    info:
      path: TapeTape/Info.plist
      properties:
        CFBundleDisplayName: TapeTape
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIUserInterfaceStyle: Light
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: splash
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: TapeTape uses the camera to take photos and videos for your chats and to scan invite QR codes.
        NSPhotoLibraryUsageDescription: TapeTape lets you pick photos and videos from your library to send.
        NSPhotoLibraryAddUsageDescription: TapeTape saves photos and videos you choose to your photo library.
        NSMicrophoneUsageDescription: TapeTape uses the microphone to record voice messages and the sound of your videos.
        LSApplicationQueriesSchemes: []
        TapeTapeFilesBackend: $(TAPETAPE_FILES_BACKEND)
        NSFaceIDUsageDescription: TapeTape uses Face ID before showing your recovery phrase or exporting a backup.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - org.tapetape.v2.refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tapetape.v2
        PRODUCT_NAME: TapeTape
        TAPETAPE_FILES_BACKEND: https://tapetape.org
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
  TapeTapeShare:
    type: app-extension
    platform: iOS
    sources:
      - path: TapeTapeShare
      - path: TapeTape/Resources
        includes:
          - "*.lproj/Localizable.strings"
          - "*.lproj/TapeTape.strings"
      - path: TapeTape/Support/L10n.swift
    dependencies:
      - target: TapeTapeCore
        embed: false
    entitlements:
      path: TapeTapeShare/TapeTapeShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.tapetape.v2
    info:
      path: TapeTapeShare/Info.plist
      properties:
        CFBundleDisplayName: TapeTape
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tapetape.v2.share
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  TapeTapeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TapeTapeUITests
    dependencies:
      - target: TapeTape
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tapetape.v2.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TapeTape
schemes:
  TapeTape:
    build:
      targets:
        TapeTape: all
    test:
      targets:
        - TapeTapeUITests
