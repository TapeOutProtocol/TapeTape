[workspace]
resolver = "2"
members = ["crates/taperelay", "crates/tapetape-core", "crates/uniffi-bindgen"]

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
rand = "0.8"
regex = "1.10"
serde = "1.0"
serde_json = "1"
tokio = "1"
uniffi = "0.32"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
