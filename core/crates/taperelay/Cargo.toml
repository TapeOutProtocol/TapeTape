[package]
name = "taperelay"
version = "0.1.0"
description = "TapeRelay user-identity messaging protocol"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
blake2 = "0.10"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
crypto_secretbox = { version = "0.1", default-features = false, features = ["alloc", "salsa20"] }
hex = "0.4"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
rand = { workspace = true }
regex = { workspace = true }
salsa20 = "0.10"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
sha3 = "0.10"
x25519-dalek = { version = "2", default-features = false }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
