[package]
name = "tapetape-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "tapetape_core"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
taperelay = { path = "../taperelay" }
anyhow = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
uniffi = { workspace = true }
bip39 = "2"
brotli = "8"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
hex = "0.4"
hmac = "0.12"
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "std"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "socks"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
scrypt = { version = "0.11", default-features = false }
shadowsocks = { version = "=1.22.0", default-features = false, features = ["aead-cipher", "aead-cipher-2022"] }
libc = "0.2"
tar = { version = "0.4", default-features = false }
thiserror = "2"
imagesize = "0.13"
mime_guess = "2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = { version = "0.11", default-features = false }

[dev-dependencies]
tempfile = "3"
